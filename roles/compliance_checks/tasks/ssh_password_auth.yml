---
- name: Check SSH password auth config
  ansible.builtin.command: grep -E '^PasswordAuthentication' /etc/ssh/sshd_config
  register: ssh_password_auth_check
  changed_when: false
  failed_when: false
  when: ansible_system == 'Linux'

- name: Record SSH password auth result
  ansible.builtin.set_fact:
    compliance_results: >-
      {{
        compliance_results | default([]) + [{
          'control': 'ssh_password_auth',
          'status': ('pass' if ssh_password_auth_check.stdout is match('(?im)^PasswordAuthentication\\s+no\\s*$') else 'fail'),
          'details': ssh_password_auth_check.stdout | default('PasswordAuthentication not set')
        }]
      }}
  when: ansible_system == 'Linux'
