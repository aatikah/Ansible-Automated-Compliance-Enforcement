---
- name: Check for accounts with empty passwords
  ansible.builtin.command: 'awk -F: ''($2 == "") { print $1 }'' /etc/shadow'
  register: empty_password_users
  changed_when: false
  failed_when: false
  when: ansible_system == 'Linux'

- name: Record empty password result
  ansible.builtin.set_fact:
    compliance_results: >-
      {{
        compliance_results | default([]) + [{
          'control': 'empty_passwords',
          'status': ('pass' if empty_password_users.stdout | trim | length == 0 else 'fail'),
          'details': empty_password_users.stdout | default('No empty-password accounts found')
        }]
      }}
  when: ansible_system == 'Linux'
