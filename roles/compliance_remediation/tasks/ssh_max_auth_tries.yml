---
- name: Set MaxAuthTries to 4
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 4'
    state: present
  when: ansible_system == 'Linux'

- name: Restart ssh service
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: ansible_system == 'Linux'
